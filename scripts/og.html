<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;width:1200px;height:630px;background:#f6f8ff;font-family:Inter,system-ui,sans-serif;color:#0b1021;overflow:hidden;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(148,163,184,.07) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 30%,transparent 75%)}

  .glow2{position:absolute;width:700px;height:500px;right:-200px;bottom:-200px;background:radial-gradient(closest-side,rgba(52,120,246,.2),transparent)}
  .c{position:absolute;left:72px;top:72px;right:72px}

  .g{background:linear-gradient(100deg,#2448ff 10%,#2448ff 45%,#7190ff 90%);-webkit-background-clip:text;color:transparent}
  p{font-size:22px;color:#53617b;max-width:600px;line-height:1.4;margin-top:26px}
  .tags{position:absolute;left:72px;bottom:64px;display:flex;gap:12px}

  svg.g2{position:absolute;right:-20px;top:92px}
</style></head><body>
<div class="grid"></div><div class="glow"></div><div class="glow2"></div>
<div class="c">

  <h1>Find the cause<br>behind PostgreSQL<br><span class="g">slowdowns.</span></h1>
  <p>Open-source PostgreSQL monitoring and incident investigation. Blocking chains, query baselines, and incidents that keep their evidence.</p>
</div>
